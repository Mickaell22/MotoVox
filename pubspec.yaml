name: motovox
description: Intercomunicador para moto via sockets TCP sobre hotspot WiFi local.
publish_to: 'none'

version: 1.3.0+4

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_sound: ^9.2.0
  network_info_plus: ^4.1.0
  permission_handler: ^11.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6
  share_plus: ^7.2.2
  shared_preferences: ^2.2.3
  http: ^1.2.1
  ffi: ^2.1.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
